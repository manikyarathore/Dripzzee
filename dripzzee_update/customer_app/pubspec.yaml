name: customer_app
description: Dripzzee — Fashion Around You (Customer App)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + UI
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # Firebase (shared backend)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0
  # 6.x API (signIn / authentication); 7.x changed it.
  google_sign_in: '>=6.2.1 <7.0.0'

  # Device services
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # Payments (UPI / cards / net banking)
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
